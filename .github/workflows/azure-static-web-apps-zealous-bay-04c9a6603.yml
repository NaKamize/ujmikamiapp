name: Azure Multi-Service CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_frontend:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_BAY_04C9A6603 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend/"
          api_location: "api"
          output_location: "build"
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: true
          CI: false

  build_and_deploy_backend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and Deploy Django Backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Deploy Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ujmikamiacr
          containerAppName: ujmikamiapp-env
          containerAppEnvironment: ujmikamiapp-env-env
          resourceGroup: ujmikamiapp2
          appSourcePath: ${{ github.workspace }}/backend/ujmikamiapp
          dockerfilePath: Dockerfile
          acrUsername: ujmikamiacr
          acrPassword: ${{ secrets.ACR_PASSWORD }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_BAY_04C9A6603 }}
          action: "close"