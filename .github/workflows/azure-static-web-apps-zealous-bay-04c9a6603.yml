name: Azure Multi-Service CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  test_backend:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Test Django Backend
    defaults:
      run:
        working-directory: backend/ujmikamiapp
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ujmikamiapp
          MYSQL_USER: ujmikamiapp
          MYSQL_PASSWORD: ujmikamiapp
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "False"
      DATABASE_URL: mysql://ujmikamiapp:ujmikamiapp@127.0.0.1:3306/ujmikamiapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Grant test-database privileges
        run: mysql -h 127.0.0.1 -uroot -prootpassword -e "GRANT ALL PRIVILEGES ON \`test_%\`.* TO 'ujmikamiapp'@'%'; FLUSH PRIVILEGES;"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage report

  test_frontend:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Test React Frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true

      - name: Build (also runs CRA's built-in ESLint check)
        run: npm run build
        env:
          CI: true

  test_fastapi_ai:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Test FastAPI AI Microservice
    defaults:
      run:
        working-directory: fastapi-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (CPU-only torch, matches Dockerfile)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -v

  build_and_deploy_frontend:
    needs: test_frontend
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_BAY_04C9A6603 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend/"
          api_location: "api"
          output_location: "build"
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: true
          CI: false
          REACT_APP_API_BASE_URL: "https://ujmikamiapp-env.kindbush-72762bde.westus2.azurecontainerapps.io"

  build_and_deploy_backend:
    needs: test_backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and Deploy Django Backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Deploy Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ujmikamiacr
          containerAppName: ujmikamiapp-env
          containerAppEnvironment: ujmikamiapp-env-env
          resourceGroup: ujmikamiapp2
          appSourcePath: ${{ github.workspace }}/backend/ujmikamiapp
          dockerfilePath: Dockerfile
          acrUsername: ujmikamiacr
          acrPassword: ${{ secrets.ACR_PASSWORD }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_BAY_04C9A6603 }}
          action: "close"
