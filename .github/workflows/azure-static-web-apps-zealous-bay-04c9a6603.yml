name: Azure Multi-Service CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  test_backend:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Test Django Backend
    defaults:
      run:
        working-directory: backend/ujmikamiapp
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ujmikamiapp
          POSTGRES_USER: ujmikamiapp
          POSTGRES_PASSWORD: ujmikamiapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ujmikamiapp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "False"
      DATABASE_URL: postgres://ujmikamiapp:ujmikamiapp@127.0.0.1:5432/ujmikamiapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage report

  test_frontend:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Test React Frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true

      - name: Build (also runs CRA's built-in ESLint check)
        run: npm run build
        env:
          CI: true

  test_fastapi_ai:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Test FastAPI AI Microservice
    defaults:
      run:
        working-directory: fastapi-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (CPU-only torch, matches Dockerfile)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -v

  build_and_deploy_fastapi_ai:
    needs: test_fastapi_ai
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and Deploy FastAPI AI Service
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ujmikamiacr.azurecr.io -u ujmikamiacr --password-stdin

      - name: Build and push image
        run: |
          docker build \
            -t ujmikamiacr.azurecr.io/fastapi-ai:latest \
            -t ujmikamiacr.azurecr.io/fastapi-ai:${{ github.run_id }} \
            fastapi-ai
          docker push ujmikamiacr.azurecr.io/fastapi-ai:latest
          docker push ujmikamiacr.azurecr.io/fastapi-ai:${{ github.run_id }}

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Roll out new image (if app exists)
        run: |
          if az containerapp show -n ujmikami-ai -g ujmikamiapp2 &>/dev/null; then
            az containerapp update -n ujmikami-ai -g ujmikamiapp2 \
              --image ujmikamiacr.azurecr.io/fastapi-ai:${{ github.run_id }}
          else
            echo "ujmikami-ai not created yet (terraform apply pending) - skipping rollout"
          fi

  terraform_plan:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Terraform Plan
    defaults:
      run:
        working-directory: terraform
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_neon_database_url: ${{ secrets.TF_VAR_NEON_DATABASE_URL }}
      TF_VAR_django_secret_key: ${{ secrets.TF_VAR_DJANGO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color -input=false | tee plan_output.txt

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8').slice(-60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan\n\`\`\`\n${plan}\n\`\`\``
            });

  terraform_apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Terraform Apply
    environment: production-infra
    defaults:
      run:
        working-directory: terraform
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_neon_database_url: ${{ secrets.TF_VAR_NEON_DATABASE_URL }}
      TF_VAR_django_secret_key: ${{ secrets.TF_VAR_DJANGO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

  build_and_deploy_frontend:
    needs: test_frontend
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_BAY_04C9A6603 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend/"
          api_location: "api"
          output_location: "build"
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: true
          CI: false
          REACT_APP_API_BASE_URL: "https://ujmikamiapp-env.kindbush-72762bde.westus2.azurecontainerapps.io"
          REACT_APP_AI_SERVICE_URL: "https://ujmikami-ai.kindbush-72762bde.westus2.azurecontainerapps.io"

  build_and_deploy_backend:
    needs: test_backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and Deploy Django Backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Deploy Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ujmikamiacr
          containerAppName: ujmikamiapp-env
          containerAppEnvironment: ujmikamiapp-env-env
          resourceGroup: ujmikamiapp2
          appSourcePath: ${{ github.workspace }}/backend/ujmikamiapp
          dockerfilePath: Dockerfile
          acrUsername: ujmikamiacr
          acrPassword: ${{ secrets.ACR_PASSWORD }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_BAY_04C9A6603 }}
          action: "close"
