services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ujmikamiapp
      POSTGRES_USER: ujmikamiapp
      POSTGRES_PASSWORD: ujmikamiapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ujmikamiapp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend/ujmikamiapp
      dockerfile: Dockerfile
    environment:
      - PRODUCTION=false
    env_file:
      - ./backend/ujmikamiapp/.env
    volumes:
      - ./backend/ujmikamiapp:/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ""
        REACT_APP_AI_SERVICE_URL: "http://localhost:8002"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

  chroma-db:
    image: chromadb/chroma:latest
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
    volumes:
      - chroma_data:/data
    ports:
      - "8001:8000"
    restart: unless-stopped

  fastapi-ai:
    build:
      context: ./fastapi-ai
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - OLLAMA_MODEL=qwen2.5-coder:latest
      - CHROMA_MODE=http
      - CHROMA_HOST=127.0.0.1
      - CHROMA_PORT=8001
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - ./fastapi-ai:/app
    depends_on:
      - chroma-db
    command: ["uvicorn", "main:app", "--host", "127.0.0.1", "--port", "8002"]
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data: